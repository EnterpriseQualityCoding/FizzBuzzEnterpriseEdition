apply plugin: 'java'
apply plugin: 'application'

repositories {
    jcenter()
}

sourceSets {
    main {
        java {
            srcDir 'src/main/java'
        }
        resources {
            srcDir 'resources/assets/configuration/spring/dependencyinjection/configuration/'
        }
    }
}

dependencies {
    implementation 'org.springframework:spring-aop:6.2.3',
            'org.springframework:spring-beans:6.2.3',
            'org.springframework:spring-context:6.2.3',
            'org.springframework:spring-core:6.2.3',
            'org.springframework:spring-expression:6.2.3',
            'javax.annotation:javax.annotation-api:1.3.2'

    testImplementation 'junit:junit:4.8.2'
}

mainClassName = 'com.seriouscompany.business.java.fizzbuzz.packagenamingpackage.impl.Main'